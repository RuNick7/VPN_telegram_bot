# Tests on Linux, macOS and Windows; builds every file; opens the built app
# on a real Mac and real Windows (x64 and ARM64) to see its window work, and
# the Android app on an emulator to see a check run there; and on a version
# tag (v1.2.0), or a version given to «Run workflow», publishes all of it as
# a release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Опубликовать выпуск с этой версией (v1.2.0, v1.2.0-beta.1); пусто: только собрать"
        required: false
        default: ""

permissions:
  contents: read

env:
  # Compiled into the app: the website it asks about the subscription and
  # sends reports to, and the hosts subscription links are on. Repository
  # variables (Settings → Variables) override them.
  SITE: ${{ vars.SITE || 'https://kairavpn.pro' }}
  DOMAINS: ${{ vars.DOMAINS || 'sub.kairavpn.pro' }}
  # A tag or «Run workflow» names the version; anything else is described
  # from git.
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release || '' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # The window's own code: WebKit on macOS, WebView2 on Windows.
      - run: go vet -tags desktop,production ./cmd/vpncheck-app
      # Real Xray servers on 127.0.0.1 and a worker process per server, as
      # on a customer's computer.
      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/*
            !dist/SHA256SUMS
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: packaging/macos.sh
      - name: Open the app (Apple silicon)
        run: packaging/smoke-macos.sh "$RUNNER_TEMP/macos-arm64.png"
      - name: Open the app (Intel, through Rosetta)
        continue-on-error: true
        run: SMOKE_ARCH=x86_64 packaging/smoke-macos.sh "$RUNNER_TEMP/macos-intel.png"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/KairaVPN-Check.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-macos
          path: ${{ runner.temp }}/macos-*.png
          if-no-files-found: ignore

  windows:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            exe: KairaVPN-Check-x64.exe
          - runner: windows-11-arm
            exe: KairaVPN-Check-arm64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist
      - name: Open the app
        shell: pwsh
        run: packaging/smoke-windows.ps1 -Exe "dist/${{ matrix.exe }}" -Shot "$env:RUNNER_TEMP/${{ matrix.exe }}.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.exe }}
          path: ${{ runner.temp }}/*.png
          if-no-files-found: ignore

  # The APK for phones: 64- and 32-bit ARM. Signed with the release key
  # when the repository has one (Settings → Secrets: ANDROID_KEYSTORE_BASE64,
  # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD), with
  # a throwaway debug key otherwise: good for a test install, but every build
  # is then a different app to the phone, and does not update the last one.
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Release key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/KairaVPN-Check.apk
          if-no-files-found: error

  # The same app built for an x86_64 emulator, debuggable, and with no site
  # or domains compiled in, so the check can be pointed at any address: it
  # starts, its page loads, and a check goes through the phone's DNS and TLS.
  android-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build for the emulator
        env:
          ABIS: x86_64
          SITE: ""
          DOMAINS: ""
        run: android/build.sh debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run a check on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: android/smoke.sh "$RUNNER_TEMP/android.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-android
          path: ${{ runner.temp }}/android.png
          if-no-files-found: ignore

  release:
    if: github.ref_type == 'tag' || startsWith(inputs.release, 'v')
    needs: [test, build, macos, windows, android, android-emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: release
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$VERSION" in
            v[0-9]*.[0-9]*) ;;
            *) echo "not a version: $VERSION" >&2; exit 1 ;;
          esac
          cd release
          sha256sum * > SHA256SUMS
          ls -la
          # A version with a suffix (v1.2.0-beta.1) is a pre-release.
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          # Started by hand, the tag does not exist yet: it goes on the
          # commit that was built.
          gh release create "$VERSION" * $pre \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "KairaVPN Проверка $VERSION" \
            --notes-file ../.github/release-notes.md
