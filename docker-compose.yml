services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tgvpn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tgvpn}
      POSTGRES_DB: ${POSTGRES_DB:-tgvpn}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tgvpn} -d ${POSTGRES_DB:-tgvpn}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path=/migrations",
        "-database=postgresql://${POSTGRES_USER:-tgvpn}:${POSTGRES_PASSWORD:-tgvpn}@postgres:5432/${POSTGRES_DB:-tgvpn}?sslmode=disable",
        "up",
      ]

  # Default: all three bot processes in one container, supervised by
  # run_all.py. `docker compose up -d` brings up postgres + migrate + this.
  bots:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tgvpn}:${POSTGRES_PASSWORD:-tgvpn}@postgres:5432/${POSTGRES_DB:-tgvpn}
      WEBHOOK_HOST: 0.0.0.0
    ports:
      - "${WEBHOOK_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # The same three processes as separate services, for restarting or reading
  # the logs of one bot without touching the others:
  #     docker compose --profile separate up -d
  # Never run these alongside `bots` -- two pollers on one Telegram token fight
  # each other for updates, and both would bind the webhook port.
  admin_bot:
    profiles: ["separate"]
    build:
      context: .
      dockerfile: admin_bot/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tgvpn}:${POSTGRES_PASSWORD:-tgvpn}@postgres:5432/${POSTGRES_DB:-tgvpn}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  user_bot:
    profiles: ["separate"]
    build:
      context: .
      dockerfile: user_bot/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tgvpn}:${POSTGRES_PASSWORD:-tgvpn}@postgres:5432/${POSTGRES_DB:-tgvpn}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  user_bot_webhook:
    profiles: ["separate"]
    build:
      context: .
      dockerfile: user_bot/Dockerfile
    command: ["python", "run_webhook.py"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tgvpn}:${POSTGRES_PASSWORD:-tgvpn}@postgres:5432/${POSTGRES_DB:-tgvpn}
      WEBHOOK_HOST: 0.0.0.0
    ports:
      - "${WEBHOOK_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
