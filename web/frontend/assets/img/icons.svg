<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" focusable="false">
<!--
  Icon sprite, referenced as <use href="/assets/img/icons.svg#i-name">.

  Hand-drawn rather than pulled from Material Symbols, for two reasons. The
  first is that the icon font was loaded from a Google CDN, and a customer who
  cannot reach it would have seen the literal words "person" and "devices"
  where the icons belong -- a failure mode that lands hardest on exactly the
  people this service is sold to. The second is weight: the whole set below is
  smaller than one request for the font.

  There is deliberately no <style> block in here. CSS inside a sprite does not
  apply to content cloned by an *external* <use>, so styling the symbols from
  here would leave every icon as an unstyled black fill -- invisible on a black
  page. Instead the paint comes from `.icon` in app.css: fill, stroke,
  stroke-width and the line joins are all inherited properties, so setting them
  on the referencing <svg class="icon"> reaches the cloned content. An inline
  <style> here would also be refused by the page's Content-Security-Policy.
-->

<!-- navigation -->
<symbol id="i-dashboard" viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v4h-7zM14 11h7v10h-7zM3 14h7v7H3z"/></symbol>
